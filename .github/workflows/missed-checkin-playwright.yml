name: Missed Check In Playwright Tests
on:
  # Run manually via GitHub API / Action tab
  workflow_dispatch:

  pull_request:

  schedule:
    - cron: "0 11 * * 1-5"

# All three suites drive the same Delius account, so only one may run at a time.
concurrency:
  group: esupervision-e2e-delius
  cancel-in-progress: false

jobs:
  test:
    # 5 minutes of test, plus npm ci and a browser install on a cold cache.
    timeout-minutes: 25
    runs-on: [self-hosted, hmpps-github-actions-runner]
    env:
      TZ: Europe/London
      # Dev only: the API's manual job triggers are switched on there and nowhere
      # else.
      ESUPERVISION_API_URL: https://esupervision-api-dev.hmpps.service.justice.gov.uk
      AUTH_URL: https://sign-in-dev.hmpps.service.justice.gov.uk
      MPOP_URL: https://manage-people-on-probation-dev.hmpps.service.justice.gov.uk
      DELIUS_URL: https://ndelius.test.probation.service.justice.gov.uk
      MANAGE_CHECKINS_UI_URL: https://manage-online-check-ins-ui-dev.hmpps.service.justice.gov.uk

      # Credentials
      AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}

      # test data. No fixed CRNs - the spec creates its own offender.
      DELIUS_USERNAME: ${{ secrets.DELIUS_USERNAME }}
      DELIUS_PASSWORD: ${{ secrets.DELIUS_PASSWORD }}
      PRACTITIONER_NAME: ${{ secrets.PRACTITIONER_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install
      - name: Run Playwright tests
        id: tests
        run: npm run test:missed-checkin
      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386
        id: junit
        with:
          check_name: Missed check in test results
          report_paths: junit.xml
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
