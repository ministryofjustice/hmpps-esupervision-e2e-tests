name: Playwright Tests
on:
  # Run manually via GitHub API / Action tab
  workflow_dispatch:
    inputs:
      target:
        description: Environment whose check ins UI, API and check in UI to test (MPOP, NDelius and OASys are always dev)
        type: choice
        options:
          - dev
          - test
        default: dev
      specs:
        description: Spec files or folders to run, space separated (default all)
        type: string
        default: ""
  schedule:
    - cron: "30 7 * * 1-5"
concurrency:
  group: esupervision-e2e-shared-state
  cancel-in-progress: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: [self-hosted, hmpps-github-actions-runner]
    env:
      TZ: Europe/London
       # URLs
      ESUPERVISION_API_URL: ${{ inputs.target == 'test' && 'https://esupervision-api-test.hmpps.service.justice.gov.uk' || 'https://esupervision-api-dev.hmpps.service.justice.gov.uk' }}
      PROBATION_CHECK_IN_URL: ${{ inputs.target == 'test' && 'https://probation-check-in-test.hmpps.service.justice.gov.uk' || 'https://probation-check-in-dev.hmpps.service.justice.gov.uk' }}
      AUTH_URL: https://sign-in-dev.hmpps.service.justice.gov.uk
      MPOP_URL: https://manage-people-on-probation-dev.hmpps.service.justice.gov.uk
      DELIUS_URL: https://ndelius.test.probation.service.justice.gov.uk
      MANAGE_CHECKINS_UI_URL: ${{ inputs.target == 'test' && 'https://manage-online-check-ins-test.hmpps.service.justice.gov.uk' || 'https://manage-online-check-ins-ui-dev.hmpps.service.justice.gov.uk' }}
      OASYS_URL: https://t2.oasys.service.justice.gov.uk/eor/f?p=100:101

      # Credentials
      AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
      OASYS_USERNAME: ${{ secrets.OASYS_USERNAME }}
      OASYS_PASSWORD: ${{ secrets.OASYS_PASSWORD }}

      # test data
      DELIUS_USERNAME: ${{secrets.DELIUS_USERNAME }}
      DELIUS_PASSWORD: ${{secrets.DELIUS_PASSWORD }}
      TEST_MANAGE_CRN: ${{secrets.TEST_MANAGE_CRN }}
      TEST_MPOP_STOP_RESTART_CRN: ${{secrets.TEST_MPOP_STOP_RESTART_CRN }}
      TEST_RESTART_ACCREDITED_CRN: ${{secrets.TEST_RESTART_ACCREDITED_CRN }}
      TEST_TIER_A_CRN: ${{secrets.TEST_TIER_A_CRN }}
      TEST_TIER_B_CRN: ${{secrets.TEST_TIER_B_CRN }}
      TEST_TIER_C_CRN: ${{secrets.TEST_TIER_C_CRN }}
      TEST_TIER_D_CRN: ${{secrets.TEST_TIER_D_CRN }}
      TEST_TIER_E_CRN: ${{secrets.TEST_TIER_E_CRN }}
      TEST_TIER_F_CRN: ${{secrets.TEST_TIER_F_CRN }}
      TEST_TIER_G_CRN: ${{secrets.TEST_TIER_G_CRN }}
      TEST_TIER_NOT_SUPERVISED_CRN: ${{secrets.TEST_TIER_NOT_SUPERVISED_CRN }}
      TEST_NO_PACKAGE_CRN: ${{secrets.TEST_NO_PACKAGE_CRN }}
      TEST_FINAL_THIRD_CRN: ${{secrets.TEST_FINAL_THIRD_CRN }}
      TEST_EARLY_ENGAGEMENT_CRN: ${{secrets.TEST_EARLY_ENGAGEMENT_CRN }}
      TEST_ADHOC_CRN: ${{secrets.TEST_ADHOC_CRN }}

      PRACTITIONER_NAME: ${{secrets.PRACTITIONER_NAME }}
      # "off" while MOCI's useEligibilityEndpoint flag is off in dev
      ELIGIBILITY_ENDPOINT: ${{ vars.ELIGIBILITY_ENDPOINT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install
      - name: Run Playwright tests
        id: tests
        env:
          SPECS: ${{ inputs.specs }}
        run: npm run test -- $SPECS
      - name: Publish JUnit report
        if: always()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386
        id: junit
        with:
          check_name: End-to-end test results
          report_paths: junit.xml
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7